name: Add LinkedIn to structured data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-linkedin-schema.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add LinkedIn to sameAs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          if '"https://kr.linkedin.com/in/ayoungp"' not in text:
              text = text.replace(
                  '"https://github.com/Ayppark",\n              "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=5040197"',
                  '"https://github.com/Ayppark",\n              "https://kr.linkedin.com/in/ayoungp",\n              "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=5040197"',
                  1,
              )
          p.write_text(text, encoding='utf-8')
          Path('.github/workflows/add-linkedin-schema.yml').unlink(missing_ok=True)
          assert '"https://kr.linkedin.com/in/ayoungp"' in p.read_text(encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add LinkedIn to structured data"
          git push
