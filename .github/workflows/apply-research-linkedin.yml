name: Apply Research label and LinkedIn link

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-research-linkedin.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update navigation and profile links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          linkedin = 'https://kr.linkedin.com/in/ayoungp'
          github_anchor = '<a href="https://github.com/Ayppark" target="_blank" rel="me noopener noreferrer">GitHub</a>'
          linkedin_anchor = f'{github_anchor}\n        <a href="{linkedin}" target="_blank" rel="me noopener noreferrer">LinkedIn</a>'

          for path in sorted(root.glob('*.html')):
              text = path.read_text(encoding='utf-8')

              text = re.sub(r'(<a href="publications\.html"[^>]*>)Publications(</a>)', r'\1Research\2', text)

              if 'linkedin.com/in/ayoungp' not in text:
                  text = text.replace(github_anchor, linkedin_anchor)

              if path.name == 'index.html' and '"https://kr.linkedin.com/in/ayoungp"' not in text:
                  text = text.replace(
                      '"https://github.com/Ayppark",\n              "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=5040197"',
                      '"https://github.com/Ayppark",\n              "https://kr.linkedin.com/in/ayoungp",\n              "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=5040197"',
                      1,
                  )

              if path.name == 'publications.html':
                  text = text.replace('Publications | A-Young Park, Ph.D.', 'Research | A-Young Park, Ph.D.')
                  text = text.replace('Publications | A-Young Park', 'Research | A-Young Park')
                  text = text.replace('Selected journal publications and working papers by A-Young Park, Ph.D., Senior Researcher at the Financial Supervisory Service.',
                                      'Research outputs, selected journal publications, and working papers by A-Young Park, Ph.D., Senior Researcher at the Financial Supervisory Service.')
                  text = text.replace('Selected publications and working papers by A-Young Park.',
                                      'Research outputs, selected publications, and working papers by A-Young Park.')
                  text = text.replace('<h2 id="publications-title">Selected Publications</h2>', '<h2 id="publications-title">Research</h2>')

              path.write_text(text, encoding='utf-8')

          readme = root / 'README.md'
          if readme.exists():
              text = readme.read_text(encoding='utf-8')
              text = text.replace('`publications.html` — selected publications and working papers', '`publications.html` — research outputs, selected publications, and working papers')
              text = text.replace('publications.html` — selected', 'publications.html` — research outputs, selected')
              readme.write_text(text, encoding='utf-8')

          workflow = root / '.github' / 'workflows' / 'apply-research-linkedin.yml'
          workflow.unlink(missing_ok=True)

          for path in root.glob('*.html'):
              text = path.read_text(encoding='utf-8')
              assert 'href="publications.html"' not in text or '>Research</a>' in text
              assert 'linkedin.com/in/ayoungp' in text
          assert '"https://kr.linkedin.com/in/ayoungp"' in (root / 'index.html').read_text(encoding='utf-8')
          PY

      - name: Commit website update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rename Publications tab to Research and add LinkedIn"
          git push
