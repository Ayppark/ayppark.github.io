name: Reorganize investor sentiment project

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/reorganize-investor-sentiment.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update Research page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('publications.html')
          text = path.read_text(encoding='utf-8')

          old_award = '<p class="venue">FMA 2023 Best Paper Award Semifinalist, Financial Intermediation &amp; Markets.</p>'
          new_award = '<p class="venue">FMA Best Paper Award Semifinalist, Financial Intermediation &amp; Markets, 2023.</p>'
          if old_award not in text:
              raise RuntimeError('Could not find the FMA award line.')
          text = text.replace(old_award, new_award, 1)

          old_article = '''          <article class="paper-entry">
            <p class="paper-kicker">Working paper</p>
            <h3 class="paper-title">Investor Sentiment and Stock Return Predictability: The Influence of Online Stock Discussion Boards</h3>
            <p class="authors"><strong>A-Young Park</strong>, Danbi Park, and Gabjin Oh</p>
          </article>
'''
          if old_article not in text:
              raise RuntimeError('Could not find the Investor Sentiment working-paper entry.')
          text = text.replace(old_article, '', 1)

          anchor = '''          <article class="paper-entry">
            <p class="paper-kicker">Research in progress</p>
            <h3 class="paper-title">Forecast Consensus, Credit Terms, and Subsequent Repricing</h3>
          </article>
'''
          replacement = anchor + '''
          <article class="paper-entry">
            <p class="paper-kicker">Research in progress</p>
            <h3 class="paper-title">Investor Sentiment and Stock Return Predictability: The Influence of Online Stock Discussion Boards</h3>
            <p class="authors">with Danbi Park and Gabjin Oh</p>
          </article>
'''
          if anchor not in text:
              raise RuntimeError('Could not find the Research in Progress insertion point.')
          text = text.replace(anchor, replacement, 1)

          assert text.count('Investor Sentiment and Stock Return Predictability: The Influence of Online Stock Discussion Boards') == 1
          assert 'FMA Best Paper Award Semifinalist, Financial Intermediation &amp; Markets, 2023.' in text
          assert '<p class="authors">with Danbi Park and Gabjin Oh</p>' in text

          path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/reorganize-investor-sentiment.yml')
          workflow.unlink(missing_ok=True)
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move investor sentiment project to research in progress"
          git push
