name: Assemble full CV

on:
  push:
    branches: [main]
    paths:
      - ".cv-source/**"
      - ".github/workflows/assemble-cv.yml"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Assemble and verify PDF
        shell: bash
        run: |
          cat .cv-source/part-* > /tmp/cv.b64
          echo "31c8664b212d6ef94e5c902ae06ec0422cafe7157e057110beb8631299f30aec  /tmp/cv.b64" | sha256sum -c -
          base64 --decode /tmp/cv.b64 > /tmp/cv.pdf.gz
          gzip -dc /tmp/cv.pdf.gz > assets/Ayoung_Park_CV.pdf
          echo "0f81021c27c3ef8e79edc9d03bf54bc68b06de66c8d1485e831b5436f89e9517  assets/Ayoung_Park_CV.pdf" | sha256sum -c -
          file assets/Ayoung_Park_CV.pdf

      - name: Commit restored full CV
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/Ayoung_Park_CV.pdf
          if git diff --cached --quiet; then
            echo "CV is already current."
            exit 0
          fi
          git commit -m "Restore full academic CV"
          git push
