name: Finalize CV page and SEO

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-site.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build CV page and technical SEO
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/finalize.py
          python /tmp/finalize.py

      - name: Commit final website
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add CV page and technical SEO"
          git push
