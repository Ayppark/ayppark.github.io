name: Fix research entries

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-research-entries.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update Research page
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/fix-research.py
          python /tmp/fix-research.py

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reorganize research entries and remove Global Banking authors"
          git push
