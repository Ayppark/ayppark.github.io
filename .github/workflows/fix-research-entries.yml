name: Fix research entries

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-research-entries.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update Research page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path("publications.html")
          text = page.read_text(encoding="utf-8")

          text = text.replace(
              "FMA 2023 Best Paper Award Semifinalist, Financial Intermediation &amp; Markets.",
              "FMA Best Paper Award Semifinalist, Financial Intermediation &amp; Markets, 2023.",
              1,
          )

          article_start = '<article class="paper-entry">'
          article_end = "</article>"

          global_title = "Global Banking Networks and Loan Pricing"
          global_pos = text.index(global_title)
          global_start = text.rfind(article_start, 0, global_pos)
          global_end = text.index(article_end, global_pos) + len(article_end)
          global_block = text[global_start:global_end]
          global_author = '<p class="authors"><strong>A-Young Park</strong> and Gabjin Oh</p>'
          if global_author not in global_block:
              raise RuntimeError("Global Banking author line not found.")
          global_block = global_block.replace(global_author, "", 1)
          text = text[:global_start] + global_block + text[global_end:]

          investor_title = "Investor Sentiment and Stock Return Predictability: The Influence of Online Stock Discussion Boards"
          investor_pos = text.index(investor_title)
          investor_start = text.rfind(article_start, 0, investor_pos)
          investor_end = text.index(article_end, investor_pos) + len(article_end)
          investor_block = text[investor_start:investor_end]
          if '<p class="paper-kicker">Working paper</p>' not in investor_block:
              raise RuntimeError("Investor Sentiment is not in Working Papers.")
          text = text[:investor_start] + text[investor_end:]

          forecast_title = "Forecast Consensus, Credit Terms, and Subsequent Repricing"
          forecast_pos = text.index(forecast_title)
          forecast_end = text.index(article_end, forecast_pos) + len(article_end)
          new_entry = "\n\n".join([
              '          <article class="paper-entry">',
              '            <p class="paper-kicker">Research in progress</p>',
              '            <h3 class="paper-title">Investor Sentiment and Stock Return Predictability: The Influence of Online Stock Discussion Boards</h3>',
              '            <p class="authors"><strong>with</strong> Danbi Park and Gabjin Oh</p>',
              '          </article>',
          ])
          text = text[:forecast_end] + "\n\n" + new_entry + text[forecast_end:]

          if text.count(investor_title) != 1:
              raise RuntimeError("Investor Sentiment must appear exactly once.")
          if "FMA Best Paper Award Semifinalist, Financial Intermediation &amp; Markets, 2023." not in text:
              raise RuntimeError("Revised FMA award line is missing.")
          if global_author in text[text.rfind(article_start, 0, text.index(global_title)):text.index(article_end, text.index(global_title))]:
              raise RuntimeError("Global Banking author line was not removed.")

          page.write_text(text, encoding="utf-8")

          for workflow_path in (
              ".github/workflows/reorganize-investor-sentiment.yml",
              ".github/workflows/fix-research-entries.yml",
          ):
              Path(workflow_path).unlink(missing_ok=True)
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reorganize research entries and remove Global Banking authors"
          git push
